name: Build standalone applications
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            label: Windows-x64
          - runner: macos-15
            arch: arm64
            label: macOS-arm64
          - runner: macos-15-intel
            arch: x64
            label: macOS-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - run: python -m pip install "pyinstaller>=6.16,<7" "certifi>=2025.1" "keyring>=25.6,<26"
      - run: python packaging/test.py
      - run: python packaging/build.py
        env:
          BUILD_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.label }}
          path: release/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.label }}
          path: frozen-smoke.json
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: Publish verified applications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          gh release create v0.11.0 *.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "QuarkBridge 0.11.0 — 自带运行环境" --notes-file ../RELEASE_NOTES.md
